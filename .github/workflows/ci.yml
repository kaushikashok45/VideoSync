name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (fmt + lint + check + test) + mutate + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Verify (fmt + lint + check app/server + test)
        run: deno task verify

      - name: Mutation testing (full repo)
        run: deno task mutate:ci

      - name: Build
        run: deno task build
