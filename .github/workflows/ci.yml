name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (fmt + lint + check + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno check --sloppy-imports app server.js

      - name: Test
        run: deno test -A --sloppy-imports

      - name: Build
        run: deno task build
